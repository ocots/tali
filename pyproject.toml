[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tali"
version = "0.0.1"
description = "Aide à la correction de copies d'examen scannées"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",   # décision 0002 : écrit le PDF, licence BSD
    "opencv-python-headless>=4.9",   # vision classique, déterministe (cahier des charges §14.1)
    "click>=8.1",   # interface en ligne de commande — BSD, même famille que crank
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "qrcode>=7.4",   # génère les QR de test — jamais utilisé en production
    "pillow>=10.0",  # requis par qrcode pour produire une image
]

[project.scripts]
tali = "tali.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tali"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
